name: chess_analyzer
description: "Chess position analyzer with a real Stockfish 19 engine."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  chess: ^0.8.1
  audioplayers: ^6.1.0
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/pieces/classic/
    - assets/pieces/flat/
    - assets/pieces/wood/
    - assets/sounds/
