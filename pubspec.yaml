name: chess_analyzer
description: "ChessCraft - analyze, play, learn, improve."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  chess: ^0.8.1
  audioplayers: ^6.1.0
  http: ^1.2.2
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  lc0: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # ChessCraft pieces / boards / UI
    - assets/chesscraft/pieces/
    - assets/chesscraft/boards/
    - assets/chesscraft/ui/

    # Maia weights (lc0 .pb.gz) - see assets/maia/README.txt
    - assets/maia/

    # New chess sounds only
    - assets/sounds/move.mp3
    - assets/sounds/take.mp3
    - assets/sounds/snap.mp3
    - assets/sounds/swap.mp3
    - assets/sounds/rewind.mp3
