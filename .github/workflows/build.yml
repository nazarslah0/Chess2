name: Build Chess Analyzer APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

  workflow_dispatch: {}

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # Checkout
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================================================
      # Flutter
      # =========================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      # =========================================================
      # Java 17
      # =========================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # =========================================================
      # Android SDK
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # =========================================================
      # Android NDK
      # =========================================================
      - name: Install Android NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "ndk;27.2.12479018"

          echo "========================================"
          echo "Android SDK"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018"

          ls -la \
            "$ANDROID_HOME/ndk/27.2.12479018"

      # =========================================================
      # Generate Android project
      # =========================================================
      - name: Generate Android project
        shell: bash
        run: |
          flutter create \
            --platforms=android \
            --org com.chessanalyzer \
            --project-name chess \
            .

      # =========================================================
      # Configure Android native library packaging
      # =========================================================
      - name: Configure Android native library packaging
        shell: bash
        run: |

          echo "========================================"
          echo "Fix AndroidManifest.xml"
          echo "========================================"

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          if not manifest.exists():
              raise SystemExit(
                  "AndroidManifest.xml not found"
              )

          text = manifest.read_text()

          # Remove extractNativeLibs if it exists.
          text = text.replace(
              ' android:extractNativeLibs="true"',
              ''
          )

          text = text.replace(
              ' android:extractNativeLibs="false"',
              ''
          )

          # ميزة تحليل مباريات Chess.com تحتاج اتصال إنترنت.
          # منح إذن INTERNET في المانيفست الرئيسي (وليس فقط
          # manifest التصحيح الذي يضيفه flutter create تلقائيًا
          # فقط لبنية debug) لأن flutter build apk هنا ينتج
          # إصدار release.
          if 'android.permission.INTERNET' not in text:
              text = text.replace(
                  '</manifest>',
                  '    <uses-permission '
                  'android:name='
                  '"android.permission.INTERNET" />\n'
                  '</manifest>',
              )

          manifest.write_text(text)

          print("AndroidManifest.xml fixed.")
          PY

          echo "========================================"
          echo "Find Android Gradle files"
          echo "========================================"

          find android \
            -maxdepth 4 \
            -type f \
            \( \
              -name "build.gradle" \
              -o \
              -name "build.gradle.kts" \
            \) \
            -print

          echo "========================================"
          echo "Configure Gradle packaging"
          echo "========================================"

          # -------------------------------------------------------
          # Kotlin DSL
          # -------------------------------------------------------
          if [ -f "android/app/build.gradle.kts" ]; then

            echo "Using Kotlin DSL:"
            echo "android/app/build.gradle.kts"

            python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "android/app/build.gradle.kts"
          )

          text = p.read_text()

          if "useLegacyPackaging" not in text:

              text += r'''

          // =======================================================
          // Stockfish native library packaging
          // =======================================================

          android {
              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }
          }
          '''

          p.write_text(text)

          print(
              "Added useLegacyPackaging to build.gradle.kts"
          )
          PY

          # -------------------------------------------------------
          # Groovy DSL
          # -------------------------------------------------------
          elif [ -f "android/app/build.gradle" ]; then

            echo "Using Groovy DSL:"
            echo "android/app/build.gradle"

            python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "android/app/build.gradle"
          )

          text = p.read_text()

          if "useLegacyPackaging" not in text:

              text += r'''

          // =======================================================
          // Stockfish native library packaging
          // =======================================================

          android {
              packagingOptions {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }
          }
          '''

          p.write_text(text)

          print(
              "Added useLegacyPackaging to build.gradle"
          )
          PY

          # -------------------------------------------------------
          # No Gradle file
          # -------------------------------------------------------
          else

            echo "ERROR: No Android app Gradle file found."

            echo "Available Gradle files:"

            find android \
              -maxdepth 6 \
              -type f \
              -name "*.gradle*" \
              -print

            exit 1

          fi

          echo "========================================"
          echo "Final Android Gradle configuration"
          echo "========================================"

          if [ -f "android/app/build.gradle.kts" ]; then
            cat android/app/build.gradle.kts
          else
            cat android/app/build.gradle
          fi

      # =========================================================
      # Configure Stockfish native bridge
      # =========================================================
      - name: Configure Stockfish native bridge
        shell: bash
        run: |

          mkdir -p \
            android/app/src/main/kotlin/com/chessanalyzer/chess

          cat > \
            android/app/src/main/kotlin/com/chessanalyzer/chess/MainActivity.kt \
            <<'EOF'

          package com.chessanalyzer.chess

          import android.os.Bundle
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.EventChannel
          import io.flutter.plugin.common.MethodChannel
          import java.io.BufferedReader
          import java.io.BufferedWriter
          import java.io.File
          import java.io.InputStreamReader

          class MainActivity : FlutterActivity() {

              companion object {
                  private const val METHOD_CHANNEL =
                      "chess_analyzer/stockfish"

                  private const val EVENT_CHANNEL =
                      "chess_analyzer/stockfish/output"

                  private const val MAX_WORKERS = 4
              }

              private val processes =
                  arrayOfNulls<Process>(MAX_WORKERS)

              private val writers =
                  arrayOfNulls<BufferedWriter>(MAX_WORKERS)

              private val locks =
                  Array(MAX_WORKERS) { Any() }

              private var eventSink:
                  EventChannel.EventSink? = null

              override fun configureFlutterEngine(
                  flutterEngine: FlutterEngine
              ) {
                  super.configureFlutterEngine(flutterEngine)

                  MethodChannel(
                      flutterEngine.dartExecutor.binaryMessenger,
                      METHOD_CHANNEL
                  ).setMethodCallHandler { call, result ->

                      when (call.method) {

                          "start" -> {
                              val worker =
                                  call.argument<Int>("worker") ?: 0

                              val started =
                                  startStockfish(worker)

                              if (started) {
                                  result.success(true)
                              } else {
                                  result.error(
                                      "STOCKFISH_START_FAILED",
                                      "تعذر تشغيل Stockfish worker $worker",
                                      null
                                  )
                              }
                          }

                          "send" -> {
                              val worker =
                                  call.argument<Int>("worker") ?: 0

                              val command =
                                  call.argument<String>("command")

                              if (command == null) {
                                  result.error(
                                      "INVALID_COMMAND",
                                      "أمر Stockfish غير موجود",
                                      null
                                  )
                              } else {
                                  sendCommand(worker, command)
                                  result.success(null)
                              }
                          }

                          "dispose" -> {
                              val worker =
                                  call.argument<Int>("worker")

                              if (worker == null) {
                                  stopAllStockfish()
                              } else {
                                  stopStockfish(worker)
                              }

                              result.success(null)
                          }

                          else -> result.notImplemented()
                      }
                  }

                  EventChannel(
                      flutterEngine.dartExecutor.binaryMessenger,
                      EVENT_CHANNEL
                  ).setStreamHandler(
                      object : EventChannel.StreamHandler {

                          override fun onListen(
                              arguments: Any?,
                              events: EventChannel.EventSink?
                          ) {
                              eventSink = events
                          }

                          override fun onCancel(
                              arguments: Any?
                          ) {
                              eventSink = null
                          }
                      }
                  )
              }

              private fun validWorker(worker: Int): Boolean {
                  return worker in 0 until MAX_WORKERS
              }

              private fun startStockfish(worker: Int): Boolean {
                  if (!validWorker(worker)) return false

                  synchronized(locks[worker]) {
                      try {
                          val existing = processes[worker]

                          if (existing != null && existing.isAlive) {
                              return true
                          }

                          val stockfishFile =
                              File(
                                  applicationInfo.nativeLibraryDir,
                                  "libstockfish.so"
                              )

                          if (!stockfishFile.exists()) {
                              eventSink?.error(
                                  "STOCKFISH_NOT_FOUND",
                                  "ملف Stockfish غير موجود: ${stockfishFile.absolutePath}",
                                  null
                              )
                              return false
                          }

                          if (!stockfishFile.canExecute()) {
                              stockfishFile.setExecutable(
                                  true,
                                  false
                              )
                          }

                          if (!stockfishFile.canExecute()) {
                              eventSink?.error(
                                  "STOCKFISH_NOT_EXECUTABLE",
                                  "ملف Stockfish غير قابل للتنفيذ",
                                  null
                              )
                              return false
                          }

                          val process =
                              ProcessBuilder(
                                  stockfishFile.absolutePath
                              )
                                  .redirectErrorStream(true)
                                  .start()

                          processes[worker] = process

                          writers[worker] =
                              process.outputStream.bufferedWriter()

                          Thread {
                              readOutput(worker, process)
                          }.apply {
                              name = "Stockfish-$worker"
                              isDaemon = true
                              start()
                          }

                          return true

                      } catch (e: Exception) {
                          eventSink?.error(
                              "STOCKFISH_EXCEPTION",
                              e.message
                                  ?: "خطأ غير معروف في تشغيل Stockfish",
                              null
                          )
                          return false
                      }
                  }
              }

              private fun readOutput(
                  worker: Int,
                  process: Process
              ) {
                  try {
                      val reader =
                          BufferedReader(
                              InputStreamReader(
                                  process.inputStream
                              )
                          )

                      while (true) {
                          val line =
                              reader.readLine()
                                  ?: break

                          // prefix ثابت يسمح لـ Dart بربط نتيجة
                          // Stockfish بالـworker الصحيح.
                          val payload =
                              "$worker|$line"

                          runOnUiThread {
                              eventSink?.success(payload)
                          }
                      }
                  } catch (e: Exception) {
                      runOnUiThread {
                          eventSink?.error(
                              "STOCKFISH_OUTPUT_ERROR",
                              "worker $worker: ${
                                  e.message ?: "خطأ في قراءة Stockfish"
                              }",
                              null
                          )
                      }
                  }
              }

              private fun sendCommand(
                  worker: Int,
                  command: String
              ) {
                  if (!validWorker(worker)) return

                  try {
                      val process = processes[worker]
                          ?: return

                      if (!process.isAlive) return

                      synchronized(locks[worker]) {
                          val writer =
                              writers[worker]
                                  ?: process.outputStream
                                      .bufferedWriter()
                                      .also {
                                          writers[worker] = it
                                      }

                          writer.write(command)
                          writer.newLine()
                          writer.flush()
                      }
                  } catch (e: Exception) {
                      eventSink?.error(
                          "STOCKFISH_SEND_ERROR",
                          "worker $worker: ${
                              e.message ?: "فشل إرسال الأمر"
                          }",
                          null
                      )
                  }
              }

              private fun stopStockfish(worker: Int) {
                  if (!validWorker(worker)) return

                  synchronized(locks[worker]) {
                      try {
                          val process = processes[worker]

                          if (process != null && process.isAlive) {
                              try {
                                  val writer = writers[worker]
                                  writer?.write("quit")
                                  writer?.newLine()
                                  writer?.flush()
                              } catch (_: Exception) {
                              }

                              process.destroy()

                              if (process.isAlive) {
                                  process.destroyForcibly()
                              }
                          }
                      } finally {
                          processes[worker] = null
                          writers[worker] = null
                      }
                  }
              }

              private fun stopAllStockfish() {
                  for (worker in 0 until MAX_WORKERS) {
                      stopStockfish(worker)
                  }
              }

              override fun onDestroy() {
                  stopAllStockfish()
                  super.onDestroy()
              }
          }
          EOF

          echo "========================================"
          echo "MainActivity.kt"
          echo "========================================"

          cat \
            android/app/src/main/kotlin/com/chessanalyzer/chess/MainActivity.kt

      # =========================================================
      # Download official Stockfish 19
      # =========================================================
      - name: Download Stockfish 19
        shell: bash
        run: |

          rm -rf stockfish

          git clone \
            --depth 1 \
            --branch sf_19 \
            https://github.com/official-stockfish/Stockfish.git \
            stockfish

          cd stockfish

          echo "========================================"
          echo "Stockfish version"
          echo "========================================"

          git describe --tags --always

          echo "Commit:"
          git rev-parse HEAD

          echo "========================================"

      # =========================================================
      # Build Stockfish 19 ARM64
      # =========================================================
      - name: Build Stockfish 19 ARM64
        shell: bash
        run: |

          cd stockfish/src

          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"

          export NDK_HOME="$ANDROID_NDK_HOME"

          export TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"

          export PATH="$TOOLCHAIN/bin:$PATH"

          echo "========================================"
          echo "Android NDK"
          echo "========================================"

          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "TOOLCHAIN=$TOOLCHAIN"

          echo "========================================"
          echo "Checking ARM64 compiler"
          echo "========================================"

          ls -lh \
            "$TOOLCHAIN/bin/aarch64-linux-android29-clang"

          ls -lh \
            "$TOOLCHAIN/bin/aarch64-linux-android29-clang++"

          echo "========================================"
          echo "Compiler version"
          echo "========================================"

          "$TOOLCHAIN/bin/aarch64-linux-android29-clang++" \
            --version

          echo "========================================"
          echo "Building Stockfish 19 ARM64"
          echo "========================================"

          make -j2 build \
            ARCH=armv8 \
            COMP=ndk \
            ANDROID_NDK_HOME="$ANDROID_NDK_HOME"

          echo "========================================"
          echo "Stockfish build result"
          echo "========================================"

          file stockfish

          ls -lh stockfish

      # =========================================================
      # Prepare Stockfish native library
      # =========================================================
      - name: Prepare Stockfish native files
        shell: bash
        run: |

          mkdir -p \
            android/app/src/main/jniLibs/arm64-v8a

          cp \
            stockfish/src/stockfish \
            android/app/src/main/jniLibs/arm64-v8a/libstockfish.so

          chmod 755 \
            android/app/src/main/jniLibs/arm64-v8a/libstockfish.so

          echo "========================================"
          echo "Stockfish native library"
          echo "========================================"

          ls -lh \
            android/app/src/main/jniLibs/arm64-v8a/libstockfish.so

          file \
            android/app/src/main/jniLibs/arm64-v8a/libstockfish.so

      # =========================================================
      # Flutter dependencies
      # =========================================================
      - name: Get dependencies
        shell: bash
        run: |
          flutter pub get

      # =========================================================
      # Flutter doctor
      # =========================================================
      - name: Flutter doctor
        shell: bash
        run: |
          flutter doctor -v

      # =========================================================
      # Static analysis
      # =========================================================
      - name: Static analysis
        shell: bash
        run: |
          flutter analyze

      # =========================================================
      # Build ARM64 APK
      # =========================================================
      - name: Build ARM64 release APK
        shell: bash
        run: |

          flutter build apk \
            --release \
            --target-platform android-arm64

      # =========================================================
      # Show APK
      # =========================================================
      - name: Show APK
        shell: bash
        run: |

          echo "========================================"
          echo "APK files"
          echo "========================================"

          ls -lh \
            build/app/outputs/flutter-apk/

      # =========================================================
      # Upload APK
      # =========================================================
      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: chess-analyzer-arm64-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # =========================================================
      # GitHub Release
      # =========================================================
      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
