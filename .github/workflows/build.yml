name: Build Chess Analyzer APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

  workflow_dispatch: {}

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # Checkout
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================================================
      # Flutter
      # =========================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      # =========================================================
      # Java 17
      # =========================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # =========================================================
      # Android SDK
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # =========================================================
      # Android NDK
      # =========================================================
      - name: Install Android NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "ndk;27.2.12479018"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018"

          ls -la \
            "$ANDROID_HOME/ndk/27.2.12479018"

      # =========================================================
      # Generate Android project
      # =========================================================
      - name: Generate Android project
        shell: bash
        run: |
          flutter create \
            --platforms=android \
            --org com.chessanalyzer \
            --project-name chess \
            .

      # =========================================================
      # Configure Stockfish native bridge
      # =========================================================
      - name: Configure Stockfish native bridge
        shell: bash
        run: |

          mkdir -p \
            android/app/src/main/kotlin/com/chessanalyzer/chess

          cat > \
            android/app/src/main/kotlin/com/chessanalyzer/chess/MainActivity.kt \
            <<'EOF'

          package com.chessanalyzer.chess

          import android.os.Bundle
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.EventChannel
          import io.flutter.plugin.common.MethodChannel
          import java.io.BufferedReader
          import java.io.File
          import java.io.InputStreamReader

          class MainActivity : FlutterActivity() {

              companion object {
                  private const val METHOD_CHANNEL =
                      "chess_analyzer/stockfish"

                  private const val EVENT_CHANNEL =
                      "chess_analyzer/stockfish/output"
              }

              private var stockfishProcess: Process? = null

              private var eventSink:
                  EventChannel.EventSink? = null

              override fun configureFlutterEngine(
                  flutterEngine: FlutterEngine
              ) {
                  super.configureFlutterEngine(
                      flutterEngine
                  )

                  // =================================================
                  // MethodChannel
                  // =================================================

                  MethodChannel(
                      flutterEngine.dartExecutor.binaryMessenger,
                      METHOD_CHANNEL
                  ).setMethodCallHandler { call, result ->

                      when (call.method) {

                          "start" -> {

                              val started =
                                  startStockfish()

                              if (started) {
                                  result.success(true)
                              } else {
                                  result.error(
                                      "STOCKFISH_START_FAILED",
                                      "تعذر تشغيل Stockfish 19",
                                      null
                                  )
                              }
                          }

                          "send" -> {

                              val command =
                                  call.argument<String>(
                                      "command"
                                  )

                              if (command == null) {

                                  result.error(
                                      "INVALID_COMMAND",
                                      "أمر Stockfish غير موجود",
                                      null
                                  )

                              } else {

                                  sendCommand(command)

                                  result.success(null)
                              }
                          }

                          "dispose" -> {

                              stopStockfish()

                              result.success(null)
                          }

                          else -> {
                              result.notImplemented()
                          }
                      }
                  }

                  // =================================================
                  // EventChannel
                  // =================================================

                  EventChannel(
                      flutterEngine.dartExecutor.binaryMessenger,
                      EVENT_CHANNEL
                  ).setStreamHandler(
                      object :
                          EventChannel.StreamHandler {

                          override fun onListen(
                              arguments: Any?,
                              events:
                                  EventChannel.EventSink?
                          ) {
                              eventSink = events
                          }

                          override fun onCancel(
                              arguments: Any?
                          ) {
                              eventSink = null
                          }
                      }
                  )
              }

              // =====================================================
              // Start Stockfish
              // =====================================================

              private fun startStockfish(): Boolean {

                  try {

                      val existing =
                          stockfishProcess

                      if (
                          existing != null &&
                          existing.isAlive
                      ) {
                          return true
                      }

                      // =============================================
                      // Locate Stockfish inside the app's native
                      // library directory.
                      //
                      // IMPORTANT: since Android 10 (API 29), the OS
                      // blocks execution of any file written to
                      // app-private storage (filesDir) at runtime
                      // (W^X policy) — that used to cause
                      // STOCKFISH_START_FAILED on every device.
                      //
                      // Files under nativeLibraryDir are extracted by
                      // the installer itself and are explicitly
                      // allowed to be executed, so we ship Stockfish
                      // as "libstockfish.so" under jniLibs and run it
                      // straight from there instead of copying it
                      // anywhere.
                      // =============================================

                      val stockfishFile =
                          File(
                              applicationInfo.nativeLibraryDir,
                              "libstockfish.so"
                          )

                      if (!stockfishFile.exists()) {

                          eventSink?.error(
                              "STOCKFISH_NOT_FOUND",
                              "ملف Stockfish غير موجود",
                              null
                          )

                          return false
                      }

                      if (!stockfishFile.canExecute()) {
                          stockfishFile.setExecutable(
                              true,
                              false
                          )
                      }

                      if (!stockfishFile.canExecute()) {

                          eventSink?.error(
                              "STOCKFISH_NOT_EXECUTABLE",
                              "ملف Stockfish غير قابل للتنفيذ",
                              null
                          )

                          return false
                      }

                      // =============================================
                      // Start process
                      // =============================================

                      stockfishProcess =
                          ProcessBuilder(
                              stockfishFile.absolutePath
                          )
                              .redirectErrorStream(true)
                              .start()

                      val process =
                          stockfishProcess
                              ?: return false

                      // =============================================
                      // Read Stockfish output
                      // =============================================

                      Thread {

                          try {

                              val reader =
                                  BufferedReader(
                                      InputStreamReader(
                                          process.inputStream
                                      )
                                  )

                              while (true) {

                                  val line =
                                      reader.readLine()
                                          ?: break

                                  runOnUiThread {

                                      eventSink?.success(
                                          line
                                      )
                                  }
                              }

                          } catch (e: Exception) {

                              runOnUiThread {

                                  eventSink?.error(
                                      "STOCKFISH_OUTPUT_ERROR",
                                      e.message
                                          ?: "خطأ في قراءة Stockfish",
                                      null
                                  )
                              }
                          }

                      }.start()

                      return true

                  } catch (e: Exception) {

                      eventSink?.error(
                          "STOCKFISH_EXCEPTION",
                          e.message
                              ?: "خطأ غير معروف في تشغيل Stockfish",
                          null
                      )

                      return false
                  }
              }

              // =====================================================
              // Send command to Stockfish
              // =====================================================

              private fun sendCommand(
                  command: String
              ) {

                  try {

                      val process =
                          stockfishProcess
                              ?: return

                      if (!process.isAlive) {
                          return
                      }

                      val writer =
                          process.outputStream
                              .bufferedWriter()

                      writer.write(command)
                      writer.newLine()
                      writer.flush()

                  } catch (e: Exception) {

                      eventSink?.error(
                          "STOCKFISH_SEND_ERROR",
                          e.message
                              ?: "فشل إرسال الأمر إلى Stockfish",
                          null
                      )
                  }
              }

              // =====================================================
              // Stop Stockfish
              // =====================================================

              private fun stopStockfish() {

                  try {

                      val process =
                          stockfishProcess

                      if (
                          process != null &&
                          process.isAlive
                      ) {

                          try {

                              val writer =
                                  process.outputStream
                                      .bufferedWriter()

                              writer.write("quit")
                              writer.newLine()
                              writer.flush()

                          } catch (_: Exception) {
                          }

                          process.destroy()
                      }

                  } finally {

                      stockfishProcess = null
                  }
              }

              // =====================================================
              // Activity destroyed
              // =====================================================

              override fun onDestroy() {

                  stopStockfish()

                  super.onDestroy()
              }
          }

          EOF

          echo "========================================"
          echo "MainActivity.kt"
          echo "========================================"

          cat \
            android/app/src/main/kotlin/com/chessanalyzer/chess/MainActivity.kt

      # =========================================================
      # Force extraction of native libraries
      # =========================================================
      # By default (AGP / Android 6+), .so files can be kept
      # compressed *inside* the APK and mapped directly from
      # there instead of being extracted to disk. We need a real,
      # standalone, executable file at nativeLibraryDir at
      # runtime (see MainActivity.kt), so we force legacy
      # extraction here.
      - name: Force native library extraction
        shell: bash
        run: |

          sed -i \
            's/<application/<application android:extractNativeLibs="true"/' \
            android/app/src/main/AndroidManifest.xml

          echo "========================================"
          echo "AndroidManifest.xml"
          echo "========================================"

          cat android/app/src/main/AndroidManifest.xml

      # =========================================================
      # Download official Stockfish 19
      # =========================================================
      - name: Download Stockfish 19
        shell: bash
        run: |

          rm -rf stockfish

          git clone \
            --depth 1 \
            --branch sf_19 \
            https://github.com/official-stockfish/Stockfish.git \
            stockfish

          cd stockfish

          echo "========================================"
          echo "Stockfish version"
          echo "========================================"

          git describe --tags --always

          echo "Commit:"
          git rev-parse HEAD

          echo "========================================"

      # =========================================================
      # Build Stockfish 19 ARM64
      # =========================================================
      - name: Build Stockfish 19 ARM64
        shell: bash
        run: |

          cd stockfish/src

          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"

          export NDK_HOME="$ANDROID_NDK_HOME"

          export TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"

          export PATH="$TOOLCHAIN/bin:$PATH"

          echo "========================================"
          echo "Android NDK"
          echo "========================================"

          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "TOOLCHAIN=$TOOLCHAIN"

          echo "========================================"
          echo "Checking ARM64 compiler"
          echo "========================================"

          ls -lh \
            "$TOOLCHAIN/bin/aarch64-linux-android29-clang"

          ls -lh \
            "$TOOLCHAIN/bin/aarch64-linux-android29-clang++"

          echo "========================================"
          echo "Compiler version"
          echo "========================================"

          "$TOOLCHAIN/bin/aarch64-linux-android29-clang++" \
            --version

          echo "========================================"
          echo "Building Stockfish 19 ARM64"
          echo "========================================"

          make -j2 build \
            ARCH=armv8 \
            COMP=ndk \
            ANDROID_NDK_HOME="$ANDROID_NDK_HOME"

          echo "========================================"
          echo "Stockfish build result"
          echo "========================================"

          file stockfish

          ls -lh stockfish

      # =========================================================
      # Prepare Stockfish native library
      # =========================================================
      # Ship the Stockfish binary as "libstockfish.so" under
      # jniLibs/arm64-v8a instead of as a plain asset. Files
      # here are extracted by the installer into
      # applicationInfo.nativeLibraryDir with the execute
      # permission needed to run them as a subprocess — plain
      # assets/filesDir copies are blocked from executing on
      # Android 10+ (W^X policy), which is what caused
      # STOCKFISH_START_FAILED.
      - name: Prepare Stockfish native files
        shell: bash
        run: |

          mkdir -p \
            android/app/src/main/jniLibs/arm64-v8a

          cp \
            stockfish/src/stockfish \
            android/app/src/main/jniLibs/arm64-v8a/libstockfish.so

          chmod 755 \
            android/app/src/main/jniLibs/arm64-v8a/libstockfish.so

          echo "========================================"
          echo "Stockfish native library"
          echo "========================================"

          ls -lh \
            android/app/src/main/jniLibs/arm64-v8a/libstockfish.so

          file \
            android/app/src/main/jniLibs/arm64-v8a/libstockfish.so

      # =========================================================
      # Flutter dependencies
      # =========================================================
      - name: Get dependencies
        shell: bash
        run: |
          flutter pub get

      # =========================================================
      # Flutter doctor
      # =========================================================
      - name: Flutter doctor
        shell: bash
        run: |
          flutter doctor -v

      # =========================================================
      # Static analysis
      # =========================================================
      - name: Static analysis
        shell: bash
        run: |
          flutter analyze || true

      # =========================================================
      # Build ARM64 APK
      # =========================================================
      - name: Build ARM64 release APK
        shell: bash
        run: |

          flutter build apk \
            --release \
            --target-platform android-arm64

      # =========================================================
      # Show APK
      # =========================================================
      - name: Show APK
        shell: bash
        run: |

          echo "========================================"
          echo "APK files"
          echo "========================================"

          ls -lh \
            build/app/outputs/flutter-apk/

      # =========================================================
      # Upload APK
      # =========================================================
      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: chess-analyzer-arm64-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # =========================================================
      # GitHub Release
      # =========================================================
      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
